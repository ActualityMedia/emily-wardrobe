name: Kindle app

on:
  push:
    paths:
      - 'android/**'
      - 'kindle/**'
      - 'wardrobe-data.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk emily-wardrobe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: emily-wardrobe-apk
          path: emily-wardrobe.apk

      # On main, keep a fixed download link the tablet can open directly:
      # https://github.com/<owner>/<repo>/releases/download/kindle-app/emily-wardrobe.apk
      - name: Publish to the kindle-app release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view kindle-app >/dev/null 2>&1 || \
            gh release create kindle-app --title "Emily's Wardrobe for Kindle" --notes "Latest Kindle Fire app, rebuilt on every change to main." --latest=false
          gh release upload kindle-app emily-wardrobe.apk --clobber
